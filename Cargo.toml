[workspace]
members = ["crates/components", "apps/docs"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
components = { path = "crates/components" }
nsh-core = "=0.6.1"
nsh-base = "=0.6.1"
nsh-engine = { version = "=0.6.1", default-features = false }
nsh-testing = { version = "=0.6.1", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
